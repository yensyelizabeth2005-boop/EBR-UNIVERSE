<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EBR: UNIVERSE</title>

   <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

    <!-- EBR CINEMATIC INTRO -->

    <main class="cinematic-intro" id="cinematicIntro">

        <div class="intro-stars">✦ ✧ ⋆ ✦ ⋆ ✧ ✦</div>

        <div class="intro-circle circle-one">
            <div class="lumi">✨</div>
        </div>

        <div class="intro-circle circle-two">
            <div class="intro-character">♡</div>
        </div>

        <div class="intro-logo">

            <h1>EBR</h1>

            <h2>UNIVERSE</h2>

        </div>

        <div class="intro-message" id="introMessage">
            <p>Hello, EBR Universe! ✨</p>
            <span>Welcome to your reality.</span>
        </div>

        <div class="welcome-message" id="welcomeMessage">
            <p>Welcome to EBR UNIVERSE.</p>
            <span>Your story begins here.</span>
        </div>

        <button class="continue-button" id="continueButton"
    onclick="document.getElementById('cinematicIntro').style.display='none'; document.getElementById('openingScreen').style.display='flex';">
    CONTINUE ✦
</button>

<button class="skip-intro"
    onclick="document.getElementById('cinematicIntro').style.display='none'; document.getElementById('openingScreen').style.display='flex';">
    SKIP
</button>

    </main>


    <!-- ORIGINAL EBR OPENING SCREEN -->

    <main class="opening-screen" id="openingScreen" style="display: none;">

        <div class="company-logo">

            <p>Creado por</p>

            <strong>♕ EBR</strong>

            <p>Compañía EBR</p>

        </div>

        <section class="game-title">

            <div class="crown">♕</div>

            <h1>EBR</h1>

            <h2>UNIVERSE</h2>

            <div class="star">✦</div>

            <p class="tagline">
                Creando por la Compañía EBR
            </p>

            <p class="tagline">
                Disfruta tu mundo de realidad.
            </p>

            <button class="start-button" onclick="startGame()">
                START ▶
            </button>

        </section>

        <div class="settings-bar">

            <button onclick="alert('Music settings coming soon!')">
                🔊 MUSIC
            </button>

            <button onclick="alert('Sound settings coming soon!')">
                🔊 SFX
            </button>

            <button onclick="alert('Settings coming soon!')">
                ⚙️ SETTINGS
            </button>

            <button onclick="alert('Account coming soon!')">
                👤 ACCOUNT
            </button>

        </div>

    </main>


    <script src="script.js?v=17"></script>

</body>

</html>
