<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EBR: UNIVERSE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="opening-screen">

        <div class="company-logo">
            <p>Creado por</p>
            <strong>♕ EBR</strong>
            <p>Compañía EBR</p>
        </div>

        <section class="game-title">

            <div class="crown">♕</div>

            <h1>EBR</h1>

            <h2>UNIVERSE</h2>

            <div class="star">✦</div>

            <p class="tagline">
                Creando por la Compañía EBR
            </p>

            <p class="tagline">
                Disfruta tu mundo de realidad.
            </p>

            <button class="start-button" onclick="startGame()">
                START ▶
            </button>

        </section>

        <div class="settings-bar">

            <button onclick="alert('Music settings coming soon!')">
                🔊 MUSIC
            </button>

            <button onclick="alert('Sound settings coming soon!')">
                🔊 SFX
            </button>

            <button onclick="alert('Settings coming soon!')">
                ⚙️ SETTINGS
            </button>

            <button onclick="alert('Account coming soon!')">
                👤 ACCOUNT
            </button>

        </div>

    </main>

    <script src="script.js?v=16"></script>

</body>

</html>
